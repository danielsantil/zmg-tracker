name: Deploy Web

on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy-web:
    name: Deploy SPA to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    defaults:
      run:
        working-directory: src/Zmg.Web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: src/Zmg.Web/package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: src/Zmg.Web/.nvmrc
          cache: pnpm
          cache-dependency-path: src/Zmg.Web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for the edge
        run: pnpm build:edge

      # Uses the wrangler pinned in package.json rather than cloudflare/wrangler-action, which
      # resolves its own version — this way CI and local deploys are byte-identical.
      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}