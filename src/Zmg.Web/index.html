<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZMG Release Tracker</title>
    <!-- Theme-aware SVG favicon (its embedded prefers-color-scheme swaps the fill for the tab bar)
         for modern browsers; the .ico is the universal fallback (Safari <16.4, older browsers);
         apple-touch-icon is the iOS home-screen tile. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Stamp theme and language onto <html> before first paint. Theme: a light-mode reload must
      // never flash dark. Language: screen readers and spellcheck read `lang` at first paint, before
      // React mounts. Both take a saved choice (zmg.theme / zmg.lang, JSON) first, else follow the
      // OS / browser. Mirrors resolveInitialTheme() in hooks/useTheme.ts and resolveInitialLanguage()
      // in i18n/language.ts — keep them in sync.
      (function () {
        try {
          var raw = localStorage.getItem('zmg.theme');
          var t = raw ? JSON.parse(raw) : null;
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
        try {
          var savedLang = localStorage.getItem('zmg.lang');
          var l = savedLang ? JSON.parse(savedLang) : null;
          if (l !== 'en' && l !== 'es') {
            l = (navigator.language || 'en').split('-')[0];
            if (l !== 'es') l = 'en';
          }
          document.documentElement.lang = l;
        } catch (e) {
          document.documentElement.lang = 'en';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
